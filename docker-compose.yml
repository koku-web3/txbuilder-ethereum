services:
  txbuilder-ethereum:
    container_name: txbuilder-ethereum
    build:
      context: .
      dockerfile: Dockerfile
    image: txbuilder-ethereum:latest
    ports:
      - "50052:50052"
    volumes:
      - ./config:/app/config:rw
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - txbuilder-network

networks:
  txbuilder-network:
    driver: bridge
